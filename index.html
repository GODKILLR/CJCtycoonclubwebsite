<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tycoon Club &mdash; Loading Theme Picker</title>
  <meta name="description" content="Tycoon Club website — preview and choose between four compliant visual themes." />
  <meta http-equiv="refresh" content="0; url=tycoon-club-themes/" />
  <link rel="canonical" href="tycoon-club-themes/" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #07090d;
      color: #ECEAE2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body {
      background-image:
        radial-gradient(ellipse at top, rgba(201, 169, 97, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse at bottom, rgba(0, 224, 255, 0.04) 0%, transparent 60%);
    }
    .pad { text-align: center; padding: 32px; max-width: 480px; }
    .crest {
      width: 32px; height: 32px;
      border: 1px solid #C9A961;
      transform: rotate(45deg);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 22px;
    }
    .crest::after {
      content: "";
      width: 10px; height: 10px;
      background: #C9A961;
      transform: rotate(-45deg);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #C9A961;
      margin-bottom: 14px;
      display: block;
      font-weight: 600;
    }
    h1 {
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 28px;
      letter-spacing: -0.02em;
      color: #ECEAE2;
      margin: 0 0 18px;
      line-height: 1.2;
    }
    h1 em { font-style: normal; color: #C9A961; font-weight: 500; }
    p {
      color: rgba(236, 234, 226, 0.7);
      font-size: 0.95rem;
      line-height: 1.65;
      margin: 0 0 22px;
    }
    a.cta {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid #C9A961;
      color: #C9A961;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease;
    }
    a.cta:hover { background: #C9A961; color: #07090d; }
    .spinner {
      width: 14px; height: 14px;
      border: 1.5px solid rgba(201, 169, 97, 0.25);
      border-top-color: #C9A961;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Belt-and-braces: also redirect via JS for clients that ignore meta-refresh.
    window.location.replace("tycoon-club-themes/");
  </script>
</head>
<body>
  <div class="pad">
    <span class="crest" aria-hidden="true"></span>
    <span class="eyebrow"><span class="spinner"></span>Opening Theme Picker</span>
    <h1>Tycoon <em>Club</em></h1>
    <p>Loading the theme picker&hellip; if you&rsquo;re not redirected automatically, follow the link below.</p>
    <a class="cta" href="tycoon-club-themes/">Open Theme Picker &rarr;</a>
  </div>
</body>
</html>
